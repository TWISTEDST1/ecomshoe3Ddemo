<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kickdrop — a 3D sneaker drop</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfcfd2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Studio backdrop: a soft grey sweep, lighter behind the phone. */
  body { background: radial-gradient(120% 90% at 50% 38%, #f3f3f4 0%, #d9d9dc 42%, #a9a9ae 100%); }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex;
    gap: 10px; justify-content: center; pointer-events: none; }
  .hud button { pointer-events: auto; border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px/1 inherit;
    color: #16171c; background: rgba(255,255,255,.82); box-shadow: 0 6px 20px rgba(0,0,0,.14);
    backdrop-filter: blur(8px); cursor: pointer; }
  .hud button:active { transform: scale(.96); }
  .tag { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font: 600 12px/1 inherit; letter-spacing: .14em; text-transform: uppercase; color: rgba(22,23,28,.45); }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.min.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="tag">Kickdrop · three.js demo</div>
<div class="hud">
  <button id="replay" type="button">Replay</button>
  <button id="sound" type="button">Sound: off</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
